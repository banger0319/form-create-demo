name: AI Code Review

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI code review
        uses: banger0319/code_cr_AI@main
        with:
          project-types: web
          model: deepseek-v4-pro
          base-url: https://api.deepseek.com
          api-key: sk-b4ab85561b4c46edb4bef452a2d0fffa
          output: ai-review.md
          fail-on-findings: 'true'
          strict-rulesets: 'true'
          language: zh-CN
          max-diff-bytes: '200000'

      - name: Upload AI review report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review
          path: ai-review.md